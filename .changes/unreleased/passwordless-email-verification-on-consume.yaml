kind: Changed
body: "passwordless: consuming a code now marks the user's email as verified only if the code was sent to that email. Signing in with a code sent to a phone number no longer verifies the email of a user who also has one; verify it with the EmailVerification recipe instead. This adds one core call to the consume code API."
