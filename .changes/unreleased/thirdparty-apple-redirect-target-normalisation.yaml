kind: Changed
body: "thirdparty: the Apple form_post callback now removes `.` and `..` segments (also percent-encoded ones, such as `%2e%2e`) from the path of `frontendRedirectURI` the way browsers do, and converts the host of an http(s) `frontendRedirectURI` to its IDNA (punycode) form if it isn't ASCII, then checks it, passes it to `IsValidFrontendRedirectURI` and redirects to it in that form (e.g. `https://app.example.com/a/../cb` becomes `https://app.example.com/cb`, and `https://bücher.example/cb` becomes `https://xn--bcher-kva.example/cb`). The default check compares hosts in their IDNA (punycode) form, so an `Origin` / `WebsiteDomain` with an internationalised domain matches redirects to it in either form. http(s) targets whose host is not a valid domain name after the conversion (e.g. it contains `/` or `@`, or has an empty label) are rejected. `IsValidFrontendRedirectURI` functions should parse the URL (e.g. with `url.Parse`) and compare its scheme, host, port and path instead of comparing strings."
