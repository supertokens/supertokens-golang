kind: Changed
body: "thirdparty: when the Google Workspaces provider is configured with a specific `hd` (in `AdditionalConfig`), sign ins without a verified id_token (e.g. with only an access token) now require the `hd` claim of the user info response to match it, as sign ins with an id_token already did. An empty `hd` has to match like any other value; leave `hd` unset or set it to `*` to allow any Google account."
time: 2026-10-16T17:10:00.000000+02:00
