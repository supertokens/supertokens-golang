kind: Changed
body: "session: `stt` (the session token type) is now a protected access token payload claim, like `sub` or `exp`, and access tokens with an `stt` claim other than `0` are rejected. `CreateNewSession` drops an `stt` key from the access token payload it is given, and `MergeIntoAccessTokenPayload` drops it from the session's current payload, but an `stt` key in the update passed to `MergeIntoAccessTokenPayload` is still set, and makes the session's access tokens invalid unless its value is `0`. So if your app sets a custom access token claim named `stt`, rename it before upgrading. Existing sessions whose access token payload carries a custom `stt` claim are not revoked, but after the upgrade requests using them get a 401, and they can't be refreshed or signed out until they are repaired. Repair them with `session.MergeIntoAccessTokenPayload(sessionHandle, map[string]interface{}{})`, which removes the claim from the session, or revoke them."
