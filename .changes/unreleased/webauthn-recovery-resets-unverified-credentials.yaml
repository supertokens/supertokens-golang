kind: Changed
body: "webauthn: account recovery now replaces the account's existing passkeys with the newly registered one and signs out its existing sessions if the account's email was not verified before the recovery. Accounts with a verified email keep their passkeys and sessions. The Go SDK doesn't mark WebAuthn emails as verified, so unless an account's email was verified another way, every account recovery resets the account's passkeys and sessions."
