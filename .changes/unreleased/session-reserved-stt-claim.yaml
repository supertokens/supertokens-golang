kind: Changed
body: "session: `stt` is now a reserved access token payload claim, like `sub` or `exp`, and access tokens with an `stt` claim other than `0` are rejected. If your app sets a custom access token claim named `stt`, rename it before upgrading. Existing sessions whose access token payload carries a custom `stt` claim are not revoked, but after the upgrade requests using them get a 401, and they can't be refreshed or signed out until they are repaired. Repair them with `session.MergeIntoAccessTokenPayload(sessionHandle, map[string]interface{}{})`, which removes the claim from the session, or revoke them."
