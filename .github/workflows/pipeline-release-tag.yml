name: "Release Pipeline"

# Thin caller of the shared reusable release-tag workflow in supertokens/actions.
# The full release skeleton (setup, register-version, mark-as-success, release,
# merge — including the post-release dev sync) lives once in the reusable
# workflow; this repo has no ecosystem publish step (the git tag IS the release
# — the Go module proxy serves from tags), so nothing else remains here.
#
# One behaviour change vs. the previous per-repo copy, inherited from the shared
# workflow (see supertokens/actions .github/workflows/release-tag.yml): the git
# tag is pushed BEFORE the API "release: true" PATCH — the tag is the release,
# so the API mark follows reality. register-version was already present in this
# repo's copy (the reusable workflow's other deliberate change only affected
# node). Everything else is a line-for-line port of this repo's pipeline.
#
# These release paths only run when a dev-sync release PR (release/vX.Y.Z) is
# merged into a version branch, or on manual dispatch — CI on a normal PR cannot
# exercise them.

on:
  pull_request:
    types: [closed]
    branches:
      - '[0-9]+.[0-9]+'

  workflow_dispatch:
    inputs:
      branch:
        description: The branch to create the release tag on
        type: string
        required: true

      skip-test-checks:
        description: Skip tests passed checks
        type: boolean
        default: false
        required: false

      skip-other-version-checks:
        description: Skip server checks for core and frontend versions
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release-pipeline:
    uses: supertokens/actions/.github/workflows/release-tag.yml@main
    secrets: inherit
    with:
      sdk_name: golang
      branch: ${{ inputs.branch || '' }}
      skip-test-checks: ${{ inputs.skip-test-checks || false }}
      skip-other-version-checks: ${{ inputs.skip-other-version-checks || false }}
      # Must cover every .changie.yaml replacement target so the release
      # changelog commit stages the bumped version file.
      changelog_add_paths: ".changes/ CHANGELOG.md supertokens/constants.go"
