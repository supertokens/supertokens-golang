kind: Changed
body: "thirdparty: the Google (including Google Workspaces), Facebook, GitLab and Discord providers now check access tokens sent to the sign in up API in `oAuthTokens` with the provider before using them, and fail the sign in if the token wasn't issued to one of the provider's configured clients. Sign ins with an authorisation code (`redirectURIInfo`) are not affected. Google: the token info API must return one of the configured client ids as `aud` or `azp`, so add every client that requests tokens for your app (e.g. web, Android and iOS) to the provider's `Clients`. Facebook: the check uses Facebook's debug token API, which needs the client's `ClientSecret`, so add it to the provider config. Setting `ValidateAccessToken` in the provider config replaces this check."
time: 2026-10-19T18:00:00.000000+02:00
