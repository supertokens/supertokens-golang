kind: Changed
body: "thirdparty: the Apple form_post callback now removes `.` and `..` segments (also percent-encoded ones, such as `%2e%2e`) from the path of `frontendRedirectURI`, then checks it, passes it to `IsValidFrontendRedirectURI` and redirects to it in that form (e.g. `https://app.example.com/a/../cb` becomes `https://app.example.com/cb`). The default check compares hosts in their IDNA (punycode) form, so an `Origin` / `WebsiteDomain` with an internationalised domain matches redirects to it in either form. `IsValidFrontendRedirectURI` functions should parse the URL (e.g. with `url.Parse`) and compare its scheme, host, port and path instead of comparing strings."
