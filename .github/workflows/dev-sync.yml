name: "Sync Dev to Version Branch"

# Thin caller of the shared reusable dev-sync workflow in supertokens/actions.
# On every push to dev, it computes the next version from unreleased changie
# fragments and creates or force-updates a release PR:
#
#   release/vX.Y.Z  ->  X.Y  (version branch)
#
# Can also be triggered manually to override the bump type. golang ships no
# generated build artifacts, so there is no release-prep step; the only file
# staged beyond the changelog is the version constant that changie rewrites
# (supertokens/constants.go, per .changie.yaml `replacements`). The
# orchestration logic lives once in the reusable workflow.

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      bump:
        description: "Override bump type (default: auto — inferred from change kinds)"
        type: choice
        default: auto
        options:
          - auto
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: supertokens/actions/.github/workflows/dev-sync.yml@main
    secrets: inherit
    with:
      bump: ${{ inputs.bump || 'auto' }}
      add_paths: ".changes/ CHANGELOG.md supertokens/constants.go"
      version_check_hint: '\`supertokens/constants.go\`'
      post_merge_note: 'the [Release Pipeline](../actions/workflows/pipeline-release-tag.yml) will trigger automatically.'
